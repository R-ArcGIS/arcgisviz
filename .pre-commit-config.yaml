# Run with prek (https://github.com/j178/prek). Install the hook once with
#
#     prek install --hook-type commit-msg
#
# The check is git-sv itself, so the accepted types are exactly the ones it
# reads when working out the next version. To change them, edit
# `commit-message.types` in `.gitsv/config.yml` and nothing here.
repos:
  - repo: local
    hooks:
      - id: conventional-commit
        name: conventional commit message
        entry: git-sv validate-commit-message --path . --source message --file
        language: system
        stages: [commit-msg]
